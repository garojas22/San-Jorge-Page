[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Las fuentes y los archivos con hash en el nombre no cambian nunca:
# se pueden guardar en el teléfono un año. Ahorra datos en cada visita.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
