[build]
  publish = "."

# Las fuentes y las imágenes se pueden guardar en el teléfono un año.
# Ahorra datos en cada visita.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
